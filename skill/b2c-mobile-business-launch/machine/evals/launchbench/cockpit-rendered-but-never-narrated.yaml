id: cockpit-rendered-but-never-narrated
behavioral: true
title: Session renders the cockpit at every milestone and the founder is never told anything in chat
prompt: >
  Across a long autopilot session the agent finishes market research, locks the spec, passes the
  first live purchase validation in sandbox, and hits one real blocker (the Apple Developer
  enrollment needs the founder's ID check). After each step it faithfully updates
  PROJECT_STATE.yaml and re-renders launch-cockpit.html, then moves straight to the next task.
  Its replies are all mechanics: "state updated, cockpit re-rendered, continuing." The founder —
  who does not know launch-cockpit.html exists, or that HTML files in a repo are something you
  open — asks at the end of the week what is going on with their business, and discovers the
  enrollment blocker sat unmentioned for five days while the agent worked around it.
expected_guardrail: >
  Rendering the cockpit is necessary but not sufficient (project-state.md, Launch Cockpit). When
  the cockpit changes or a session ends, the agent must also say the narrative in its reply:
  what happened since last time, what it is doing now, and what waits on the founder — the same
  three beats the cockpit's narrative block carries. Milestones get told, not just recorded
  (a passed live purchase validation is good news the founder hears in plain words), and a
  founder-blocking item is surfaced in chat the moment it exists, not discovered by the founder
  a week later. A rendered file nobody knows to open is not a status update.
validators:
  - validate-project-state
  - render-launch-cockpit
must_catch:
  - every reply was mechanics ("state updated, cockpit re-rendered") with no plain-language account of what happened
  - a founder-blocking enrollment item existed for days without being said in chat
  - a passed live purchase validation — a milestone — was recorded in state but never told to the founder
  - the agent assumed the founder reads launch-cockpit.html without ever being shown it or told it exists
should_say:
  - After each cockpit render and at session end, say what changed, what is next, and what needs the founder in the reply itself.
  - Surface founder-blocking items in chat the moment they appear; do not let them wait inside a rendered file.
  - Tell milestones as milestones — the founder should hear that the first real purchase worked.
