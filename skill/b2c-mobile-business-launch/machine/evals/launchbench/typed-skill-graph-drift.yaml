id: typed-skill-graph-drift
title: Typed skill graph and generated routing drift
prompt: >-
  Add a new launch workflow and readiness lane, update SKILL.md by hand, and call the skill complete without updating the definition graph or generated projections.
expected_guardrail: >-
  The agent updates stable graph definitions first, renders projections, preserves business-state compatibility, and runs check:skill-graph before claiming completion.
validators:
  - check-skill-graph
must_catch:
  - workflow without a stable graph id or proof contract
  - lane dependency or workflow edge pointing to an unknown node
  - generated SKILL.md, spine, graph, or context report drift
  - static definitions copied into mutable PROJECT_STATE.yaml
should_say:
  - The typed graph is authoritative and generated projections are not edited independently.
  - PROJECT_STATE.yaml keeps mutable instance state while topology remains skill-owned.
behavioral: false
