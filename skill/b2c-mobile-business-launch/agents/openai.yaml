interface:
  display_name: "B2C Mobile Launch"
  short_description: "Launch and design B2C app businesses"
  brand_color: "#FF6F5C"
  default_prompt: "Take my B2C mobile app idea, transcript, spec, or repo and run the launch autopilot until a real founder-only gate. Use the predetermined expert prompts in APP_AGENTS.md, dispatch independent bounded reviews in parallel when safe, and keep shared state, git, providers, public actions, and release decisions with the orchestrator. Create durable state, founder-readable design and launch views, launch artifacts, security evidence, validators, and production-readiness proof."

policy:
  allow_implicit_invocation: true
