# cascade-edges.yaml — the Change Cascade Map as data.
#
# references/change-cascade.md renders this same map as a table for humans.
# This file is what check:change-cascade reads, so "check and update or
# justify" stops being an honour system.
#
# Trust boundary, same as laneDependencies in scripts/lib/launch-state.ts:
# this file ships WITH THE SKILL and is never copied into a business repo. A
# launch run records which surfaces it touched in its own PROJECT_STATE.yaml
# `change_cascade` block; it cannot edit the edge set that grades it.
#
# When change-cascade.md's table changes, change this file in the same edit.
# Every surface id used below must exist in `surfaces`.

schema_version: "1"

# The surface inventory a B2C mobile launch maintains
# (change-cascade.md "Surface Inventory").
surfaces:
  app_in_app:
    label: "App (in-app)"
    covers: "onboarding copy/flow, core feature UI + copy, paywall copy + plan labels, settings, empty/error states, push/notification copy"
  asc_listing:
    label: "App Store Connect listing"
    covers: "name, subtitle, promotional text, description, keyword field, What's New, screenshots + caption overlays, App Preview, App Icon, in-app events, custom product pages, and every localization of all of the above"
  asc_products:
    label: "App Store Connect products"
    covers: "IAP/subscription display names + descriptions, promoted-IAP promotional images, pricing, intro/trial offers, App Review Information notes"
  revenuecat_billing:
    label: "RevenueCat / billing"
    covers: "offering/package/product display names, paywall configuration, entitlement identifiers, Stripe/web-funnel product copy and prices"
  landing_web:
    label: "Landing / web"
    covers: "hero, method/how-it-works, FAQ, pricing section, footer, <meta> description + Open Graph, JSON-LD / structured data, robots.txt / llms.txt / sitemap.xml"
  seo_geo:
    label: "SEO / GEO"
    covers: "target keywords, citability content, brand-entity signals"
  lifecycle_email:
    label: "Lifecycle email"
    covers: "transactional + lifecycle templates, brand tokens, plan/price/feature mentions"
  analytics:
    label: "Analytics"
    covers: "event names, funnel/dashboard definitions, attribution sources"
  legal:
    label: "Legal"
    covers: "privacy policy, terms, App Privacy answers, Data safety"
  content_ugc_ads:
    label: "Content / UGC / ads"
    covers: "ad creative, demo videos, screenshots reused in ads, creator scripts"

# Change type -> surfaces that must be updated or explicitly justified as
# unaffected. Mirrors the change-cascade.md "Change Cascade Map" rows; the
# `mirrors` field names the row so drift between the two is visible.
change_types:
  feature_change:
    label: "Feature added / changed / removed"
    mirrors: "Feature added / changed / removed"
    cascade_to:
      - app_in_app
      - asc_listing
      - landing_web
      - seo_geo
      - lifecycle_email
      - analytics
      - legal
      - content_ugc_ads
    notes: "legal only when the change introduces new data collection or a new SDK — justify it as unaffected otherwise"

  lexicon_change:
    label: "Core copy / feature name / brand vocabulary change"
    mirrors: "Core copy / feature name / brand vocabulary change (lexicon)"
    cascade_to:
      - app_in_app
      - asc_listing
      - asc_products
      - revenuecat_billing
      - landing_web
      - lifecycle_email
      - content_ugc_ads
    notes: "run the Lexicon Lock sweep from flow-traceability.md — grep every surface that names the term and update them together, including landing component files, <meta> description, and JSON-LD description/FAQ blocks"

  onboarding_change:
    label: "Onboarding flow change"
    mirrors: "Onboarding flow change"
    cascade_to:
      - app_in_app
      - asc_listing
      - analytics
      - landing_web
    notes: "asc_listing covers the screenshot set and App Preview when they show onboarding; analytics covers activation events/funnels and review-prompt timing"

  pricing_change:
    label: "Paywall / pricing / plan / trial change"
    mirrors: "Paywall / pricing / plan / trial change"
    cascade_to:
      - app_in_app
      - asc_listing
      - asc_products
      - revenuecat_billing
      - landing_web
      - legal
      - lifecycle_email
      - analytics
    notes: "legal covers auto-renew and price disclosure in terms; lifecycle_email covers trial/renewal/win-back"

  visual_change:
    label: "Visual / UI / design-token change"
    mirrors: "Visual / UI / design-token change"
    cascade_to:
      - app_in_app
      - asc_listing
      - landing_web
      - lifecycle_email
      - content_ugc_ads
    notes: "store screenshots and App Preview need a re-render, not a doc edit; App Icon too when the brand mark changed"

  iap_product_change:
    label: "New / renamed IAP or subscription product"
    mirrors: "New / renamed IAP or subscription product"
    cascade_to:
      - revenuecat_billing
      - asc_products
      - asc_listing
      - app_in_app
      - legal
      - analytics
    notes: "asc_products carries the promoted-IAP promotional image (unique per product, never the app icon) and the App Review Information notes"

  privacy_change:
    label: "Privacy / data / SDK change"
    mirrors: "Privacy / data / SDK change"
    cascade_to:
      - app_in_app
      - asc_listing
      - asc_products
      - legal
      - analytics
    notes: "app_in_app covers PrivacyInfo.xcprivacy and required-reason APIs; legal covers App Privacy answers, Play Data safety, privacy policy and terms; asc_products covers App Review notes for external services"

  domain_brand_change:
    label: "Domain / brand / company-name change"
    mirrors: "Domain / brand / company-name change"
    cascade_to:
      - app_in_app
      - asc_listing
      - asc_products
      - revenuecat_billing
      - landing_web
      - seo_geo
      - lifecycle_email
      - content_ugc_ads
      - legal
    notes: "everything in lexicon_change plus email sender domains, legal entity references, landing footer, and App Store seller/marketing URLs"

  generated_asset_change:
    label: "Change affecting generated assets"
    mirrors: "Design token / feature / copy / pricing change affecting generated assets"
    cascade_to:
      - content_ugc_ads
      - asc_listing
      - asc_products
      - lifecycle_email
    notes: "generated assets embed tokens, feature names, copy, and pricing at generation time — regenerate per the Generated-Asset Regeneration table in change-cascade.md, record each new asset in CONTENT_ASSETS.md, and mark prior entries status:superseded. Generated output is supporting art only and never substitutes for truthful real app UI"
