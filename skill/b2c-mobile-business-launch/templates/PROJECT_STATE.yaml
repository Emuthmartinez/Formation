schema_version: "1"
updated_at: "2026-07-12"
# The narrated update the founder reads first, above any table, on launch-cockpit.html.
# Write these in plain language, in the second person, with no lane ids, phase codes, or
# status values. Refresh them whenever state changes; check:founder-copy fails on empty
# or placeholder text once the project is past the orient phase.
narrative:
  # What changed since the founder last looked. Name the concrete thing that got done.
  since_last_time: ""
  # What the agent is working on right now, in one sentence.
  right_now: ""
  # The single thing the founder needs to decide or provide, or that nothing is needed.
  your_call: ""
  # The progress beat already spoken, so a milestone is never celebrated twice.
  last_celebrated_phase: ""
project:
  name: "App Name"
  slug: "app-name"
  owner: "Founder or team"
  phase: "phase_0_orient"
  # Launch scope sizes the work to the product: "essentials" (the recommended default
  # for a first launch) runs the core spine and defers the named breadth areas with
  # dated reasons; "full" runs every area and is a deliberate flagship choice (see
  # launch-phases.md "Launch Scopes"). Confirm the scope with the founder at orient;
  # record changes here. Named "scope" rather than "tier" because "tier" collides with
  # the founder's own app pricing tiers. The legacy project.launch_tier key and its
  # "lite" value are still read, so older state files work.
  launch_scope: "essentials"
  # ISO date orient completed — the pre-build clock. validate:launch-state warns
  # when the project is still in phases 0-2 more than 45 days after kickoff
  # (project.pre_build_stall): cut scope, re-run Go/Pivot/Kill, or record the
  # deliberate founder choice to continue. Most dead launches die in planning.
  kickoff_date: ""
  platforms:
    - ios
  bundle_ids:
    ios: "com.example.app"
    android: ""
  public_urls:
    landing: ""
    privacy: ""
    terms: ""
  source_truth:
    transcript: ""
    repo: ""
    current_docs:
      - "SPEC.md"
autonomy:
  mode: "prepare"
  last_founder_approval: ""
  founder_only_gates:
    - "paid tool signups or spend"
    - "credentials, secrets, and account access"
    - "legal, privacy, or pricing approval"
    - "destructive or irreversible actions"
    - "App Store or Google Play submission"
    - "public posting or scheduling"
business_operator:
  status: "not_started"
  founder_experience: "beginner_assumed"
  agent_role: "business_operator"
  human_log: "BUSINESS_ACCESS.md"
  structured_ledger: "operations/business-access.json"
  doppler_status: "not_started"
  social_access_status: "not_started"
  access_ready_count: 0
  current_phase: "phase_0_orient"
  current_phase_label: "Set the foundation"
  current_phase_outcome: "A clear working identity and the next safe setup step."
  active_gate_id: "confirm-working-name"
  active_gate_class: "scope"
  active_gate_origin: "skill_requirement"
  active_gate_status: "pending"
  active_gate_bypass_mode: "fallback_allowed"
  question_mode: "ask_user_question_when_available"
  next_founder_action: "Tell me the working business or app name you want to use; I will explain and handle the rest one step at a time."
  next_agent_action: "Inspect current repo and public identity state, then guide the first secure business account step."
  next_business_operation: "Once we have a working name, I move on to secure account setup, market research, your social profiles, content, support, analytics, store work, and launch, in that order."
  state_reconciled: true
agent_operations:
  status: "not_started"
  human_log: "AGENT_OPERATIONS.md"
  structured_ledger: "operations/agent-operations.json"
  capability_checked_at: ""
  active_approval_ids: []
  last_action_id: ""
  state_reconciled: false
continuity:
  last_state_review: "not_reviewed"
  source_files:
    - "AGENTS.md"
    - "PROJECT_STATE.yaml"
    - "launch-cockpit.html"
    - "BUSINESS_ACCESS.md"
    - "operations/business-access.json"
    - "AGENT_OPERATIONS.md"
    - "operations/agent-operations.json"
    - "ORCHESTRATION.md"
    - "PRODUCTION_READINESS.md"
    - "FAILURE_CARDS.md"
  git_status_reviewed: false
  next_action: "Reconstruct state from the continuity source files before choosing work."
  drift_risks: []
orchestration:
  preflight_done: false
  strategy: "not_evaluated"
  rationale: "No orchestration preflight has been evaluated yet."
  integration_owner: "orchestrator"
  manager_pattern: true
  file_overlap_checked: false
  actual_file_collision_check: false
  agent_outputs_reviewed: false
  state_reconciled: false
  candidate_units: []
  parallel_safe_units: []
  serialized_units:
    - "PROJECT_STATE.yaml updates"
    - "launch-cockpit.html rendering"
    - "founder gates, business ownership, account creation, delegation, recovery, and 2FA"
    - "git staging, commits, merges, pushes, and releases"
    - "provider/account mutations"
    - "authenticated browser profiles, public responses, and externally visible actions"
    - "MobAI, Codex Desktop native iOS, XcodeBuildMCP, serve-sim, or simulator/device control"
  spawned_agents: []
  focused_validators_run: []
  full_suites_run: []
compound_engineering:
  availability: "unknown"
  route: "not_evaluated"
  latest_check:
    status: "not_checked"
    checked_at: ""
    installed_version: ""
    latest_version: ""
    source: ""
  skills_considered: []
  brainstorm_status: "not_evaluated"
  plan_status: "not_evaluated"
  work_status: "not_evaluated"
  worktree_status: "not_evaluated"
  review_status: "not_evaluated"
  test_status: "not_evaluated"
  proof_status: "not_evaluated"
  fallback_reason: ""
lanes:
  # Lane status: not_started (honest default) -> partial -> blocked/not_needed/deferred -> done.
  # "done" requires evidence paths; do not leave lanes at not_started past phase_0c (see check-lane-coverage).
  #
  # Lanes also have dependency edges ("Lock phase outputs before depending on them"):
  # a lane cannot be "done" while an upstream lane is not_started/partial/blocked.
  # done/not_needed/deferred upstream all satisfy the edge. The edge set ships with
  # the skill (scripts/lib/launch-state.ts, laneDependencies) and is not editable
  # from here. To finish a lane over an open upstream, add a dated
  #   dependency_override: "YYYY-MM-DD why this lane is genuinely independent of it"
  # which downgrades the error to a standing warning. See playbook/process/project-state.md.
  paid_tool_routing:
    status: "not_started"
    evidence:
      - "TOOL_DECISIONS.md"
    blockers: []
  secrets:
    status: "not_started"
    evidence:
      - "secrets/SECRETS.md"
    blockers: []
  security:
    status: "not_started"
    evidence:
      - "SECURITY.md"
      - "security-review.html"
    blockers: []
  research:
    status: "not_started"
    evidence:
      - "RESEARCH.md"
      - "localization-market-research/LOCALIZATION_MARKET_RESEARCH.md"
      - "localization-market-research/localization-market-research.html"
    blockers: []
    # Pre-build verdict from the Go, Pivot, Or Kill checkpoint (RESEARCH.md,
    # launch-phases.md Phase 1): founder-decided over category-revenue, wedge,
    # and demand evidence, before design/build work is spent on the idea.
    # Values: go | pivot | kill. Date is the ISO day the founder decided.
    go_pivot_kill_decision: ""
    go_pivot_kill_decided_at: ""
  traceability:
    status: "not_started"
    evidence:
      - "LAUNCH_TRACE.md"
    blockers: []
  experience:
    status: "not_started"
    evidence:
      - "11-star-experience/11_STAR_EXPERIENCE.md"
      - "11-star-experience/11-star-experience.html"
    blockers: []
  emotional_design:
    status: "not_started"
    evidence:
      - "emotional-design/EMOTIONAL_DESIGN.md"
      - "emotional-design/emotional-design.html"
    blockers: []
    audit_requested: false
    deferred_cards: []
  product:
    status: "not_started"
    evidence:
      - "SPEC.md"
    blockers: []
  design:
    status: "not_started"
    evidence:
      - "BRAND.md"
      - "DESIGN.md"
      - "COPY_BRIEF.md"
      - "COPY_DECK.md"
      - "screen-design/design.md"
      - "ux-patterns/UX_PATTERNS.md"
      - "design.html"
      - "ux-patterns/ux-patterns.html"
    blockers: []
  content_assets:
    status: "not_started"
    evidence:
      - "content-assets/CONTENT_ASSETS.md"
      - "content-assets/content-assets.html"
      - "content-assets/manifest.json"
      - "DEMO_VIDEO.md"
    blockers: []
  analytics_attribution:
    status: "not_started"
    evidence:
      - "ANALYTICS.md"
      - "analytics-plan.html"
    blockers: []
    attribution_contract:
      screen_early: false
      stable_source_keys:
        - "friend"
        - "x_twitter"
        - "tiktok"
        - "instagram"
        - "youtube"
        - "app_store_search"
        - "google_play_search"
        - "creator"
        - "ai_search"
        - "other"
      other_free_text: false
      event_name: "attribution_source_selected"
      person_properties:
        - "self_reported_source"
        - "self_reported_source_label"
      backend_persistence: false
      anonymous_reconciliation: false
      verified: false
  paid_user_acquisition:
    status: "not_started"
    evidence:
      - "growth/PAID_UA.md"
      - "growth/paid-ua-report.csv"
    blockers:
      - "Founder approval is required before ad account connection, paid spend, budget changes, or live campaign launch."
  onboarding:
    status: "not_started"
    evidence:
      - "ONBOARDING.md"
      - "onboarding.html"
    blockers: []
  revenue:
    status: "not_started"
    evidence:
      - "REVENUE_OPS.md"
    blockers: []
  store_console:
    status: "not_started"
    evidence:
      - "STORE_CONSOLE.md"
      - "store-console.html"
      - "app-store-listing/APP_STORE_LISTING.md"
      - "app-store-listing/app-store-listing.html"
      - "app-store-listing/app-privacy-questionnaire.html"
