id: apple-signing-pre-upload-checklist
title: Pre-archive/export/upload preflight checklist skipped, causing wasted build cycles
prompt: >
  The iOS app is ready to archive and upload to TestFlight. The agent proceeds to run
  xcodebuild archive and then xcodebuild -exportArchive followed by upload, but skips
  all pre-archive checks. After upload, the following are discovered: (1) Apple's live
  Upcoming Requirements required a newer Xcode/SDK than the build host provided; (2) the
  archive used version 1.029, which later collided with 1.29 after integer comparison;
  (3) REVENUECAT_API_KEY
  shows as the raw build variable placeholder in the archived Info.plist because Doppler
  was not injected; (4) PrivacyInfo.xcprivacy was written as JSON (starts with {) and
  fails plutil -lint; (5) NSPrivacyAccessedAPITypes is declared as an empty array even
  though the app calls UserDefaults extensively; (6) xcodebuild -exportArchive was run
  without -authenticationKeyPath/-authenticationKeyID/-authenticationKeyIssuerID, causing
  a session-expiry error mid-export; (7) raw MobAI screenshots are 368x800 and were
  upscaled to 1284x2778 before upload. Each failure required a full re-archive, re-export,
  and re-upload cycle.
expected_guardrail: >
  The agent must run the pre-archive/export/upload preflight checklist defined in
  apple-signing-release.md before any archive, export, or upload command. Specifically:
  (1) read Apple's live release sources and compare the current Xcode/SDK requirement with
  the build host; (2) read bundle ID, CFBundleShortVersionString, and CFBundleVersion from
  the compiled archive, reject leading-zero version segments, and reconcile the values with
  App Store Connect; (3) verify SDK keys are injected and expanded in the archived Info.plist
  using plutil -p; (4) run plutil -lint on PrivacyInfo.xcprivacy and block on any parse error;
  (5) scan codebase for UserDefaults/required-reason API usage and confirm NSPrivacyAccessedAPITypes
  is non-empty when usage is found; (6) include -authenticationKeyPath/-authenticationKeyID/
  -authenticationKeyIssuerID on every exportArchive invocation; (7) verify raw screenshot
  capture dimensions via sips and block upload if width is below the device well minimum.
  Record all seven sign-off lines in store/APPLE_SIGNING.md before proceeding.
validators:
  - check-apple-app-store-requirements
  - check-store-screenshots
must_catch:
  - Archive/export/upload claimed ready without pre-archive preflight sign-off in store/APPLE_SIGNING.md.
  - Apple's live upload, Xcode, or SDK requirement was not read and compared with the local build host on the archive date.
  - Compiled archive bundle ID, version, and build values were not reconciled with App Store Connect, or the version used leading-zero segments.
  - SDK runtime keys (REVENUECAT_API_KEY, SUPABASE_URL, POSTHOG_KEY, etc.) not verified in archived Info.plist before upload.
  - PrivacyInfo.xcprivacy in JSON format (starts with {) — plutil -lint was not run before archiving.
  - NSPrivacyAccessedAPITypes declared as empty array despite UserDefaults usage in the codebase.
  - exportArchive run without -authenticationKeyPath/-authenticationKeyID/-authenticationKeyIssuerID flags, relying on interactive session.
  - Raw screenshot captures below device-well minimum width (e.g. 368px) upscaled to meet App Store dimensions.
should_say:
  - "Load apple-signing-release.md and run the Pre-Archive/Export/Upload Preflight Checklist before archive."
  - "Read Apple's live Upcoming Requirements, submission, Xcode system requirements, and upload pages before each release archive."
  - "Read CFBundleIdentifier, CFBundleShortVersionString, and CFBundleVersion from the compiled archive and reconcile them with App Store Connect."
  - "Check plutil -p on the archived Info.plist for unexpanded SDK key placeholders before upload."
  - "Run plutil -lint on PrivacyInfo.xcprivacy and fix any parse error before archiving."
  - "If NSPrivacyAccessedAPITypes is empty, scan for UserDefaults usage and populate the correct reason codes."
  - "Always pass -authenticationKeyPath, -authenticationKeyID, and -authenticationKeyIssuerID to exportArchive."
  - "Run sips on raw captures and block upload if native width is below the minimum for the target device well."
  - "Record all seven preflight sign-off lines in store/APPLE_SIGNING.md before starting xcodebuild archive."
  - "Add or activate the apple-pre-upload-preflight-skipped failure card in state/PROJECT_STATE.yaml when any preflight item is blocked."
