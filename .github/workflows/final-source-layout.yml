name: Final Source Layout

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/refactor-source-layout.py
      - scripts/fix-source-layout-contracts.py
      - scripts/repair-final-source-layout.py
      - .github/workflows/final-source-layout.yml

permissions:
  contents: write

jobs:
  refactor:
    name: migrate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Apply source layout migration
        run: |
          python3 scripts/refactor-source-layout.py
          python3 scripts/fix-source-layout-contracts.py
          python3 scripts/repair-final-source-layout.py
      - name: Format and regenerate
        run: |
          npm run format --prefix skill/b2c-mobile-business-launch
          npm run render:skill-graph --prefix skill/b2c-mobile-business-launch
          python3 scripts/repair-final-source-layout.py
          npm run format --prefix skill/b2c-mobile-business-launch
          npm run render:design-room --prefix skill/b2c-mobile-business-launch -- --root workspace/business --out design/design-room.html --static-only
      - name: Persist migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: materialize consolidated source layout"
          git push origin HEAD:${{ github.head_ref }}
