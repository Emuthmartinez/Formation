name: Final Source Layout

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/repair-migrated-fixtures.py
      - .github/workflows/final-source-layout.yml

permissions:
  contents: write

jobs:
  refactor:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Repair migrated fixtures
        run: python3 scripts/repair-migrated-fixtures.py
      - name: Format
        run: npm run format --prefix skill/b2c-mobile-business-launch
      - name: Full audit
        run: npm run audit:ci
      - name: Package dry run
        run: npm pack --dry-run --json
      - name: Commit fixture repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill/b2c-mobile-business-launch/validation/repository/fixtures
          git commit -m "test: align fixtures with consolidated layout"
          git push origin HEAD:${{ github.head_ref }}
