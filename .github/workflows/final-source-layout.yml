name: Final Source Layout

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/refactor-source-layout.py
      - scripts/fix-source-layout-contracts.py
      - scripts/repair-final-source-layout.py
      - .github/workflows/final-source-layout.yml

permissions:
  contents: write

jobs:
  refactor:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Apply source layout migration
        run: |
          python3 scripts/refactor-source-layout.py
          python3 scripts/fix-source-layout-contracts.py
          python3 scripts/repair-final-source-layout.py
      - name: Format
        run: npm run format --prefix skill/b2c-mobile-business-launch
      - name: Regenerate graph projections
        run: npm run render:skill-graph --prefix skill/b2c-mobile-business-launch
      - name: Normalize generated outputs
        run: |
          python3 scripts/repair-final-source-layout.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          skill = Path('skill/b2c-mobile-business-launch')

          for rel in [
              'validation/business/process/check-hooks-installed.ts',
              'tooling/install-hooks.ts',
              'tooling/lib/hook-contract.ts',
          ]:
              path = skill / rel
              text = path.read_text()
              text = text.replace(
                  'path.join("business", "engineering/repo-agent-entrypoints", "settings.json")',
                  'path.join("workspace", "business", "engineering/repo-agent-entrypoints", "settings.json")',
              )
              text = text.replace(
                  '"business", "engineering", "repo-agent-entrypoints"',
                  '"workspace", "business", "engineering", "repo-agent-entrypoints"',
              )
              text = text.replace(
                  'business/engineering/repo-agent-entrypoints',
                  'workspace/business/engineering/repo-agent-entrypoints',
              )
              text = text.replace('workspace/workspace/business', 'workspace/business')
              path.write_text(text)

          fixture = skill / 'validation/repository/fixtures/repo-gates.fixtures.ts'
          text = fixture.read_text()
          text = text.replace(
              'import { cpSync, mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs";',
              'import { cpSync, existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs";',
          )
          replacement = '''const sourceCandidates = [
        rel,
        rel.startsWith("business/design/system/") ? rel.replace("business/design/system/", "studio/generated/system/") : rel,
        rel.startsWith("design/system/") ? rel.replace("design/system/", "studio/generated/system/") : rel,
        rel.startsWith("business/") ? `workspace/${rel}` : rel,
        rel.startsWith("playbook/") ? rel.replace("playbook/", "knowledge/") : rel,
      ];
      const sourceRel = sourceCandidates.find((candidate) => existsSync(path.join(skillRoot, candidate))) ?? rel;
      const text = readFileSync(path.join(skillRoot, sourceRel), "utf8");'''
          text, count = re.subn(
              r'const sourceRel = rel\.startsWith\("business/studio/generated/"\)[\s\S]*?const text = readFileSync\(path\.join\(skillRoot, sourceRel\), "utf8"\);',
              replacement,
              text,
              count=1,
          )
          text, direct_count = re.subn(
              r'const text = readFileSync\(path\.join\(skillRoot,\s*rel\),\s*["\']utf8["\']\);',
              replacement,
              text,
          )
          count += direct_count
          if count == 0:
              raise SystemExit('fixture helper source read was not found for normalization')
          fixture.write_text(text)

          root_package = Path('package.json')
          data = json.loads(root_package.read_text())
          data['scripts']['check:business-control-plane-workspace'] = (
              'tsx skill/b2c-mobile-business-launch/tooling/render-business-control-plane-workspace.ts '
              '--root skill/b2c-mobile-business-launch/workspace/business '
              '--business-state state/business.json '
              '--launch-state state/PROJECT_STATE.yaml '
              '--schema skill/b2c-mobile-business-launch/studio/seed/schema/workspace.schema.json --check'
          )
          root_package.write_text(json.dumps(data, indent=2) + '\n')

          runtime_package = skill / 'package.json'
          data = json.loads(runtime_package.read_text())
          data['scripts']['check:business-control-plane-workspace'] = (
              'tsx tooling/render-business-control-plane-workspace.ts '
              '--root workspace/business '
              '--business-state state/business.json '
              '--launch-state state/PROJECT_STATE.yaml '
              '--schema studio/seed/schema/workspace.schema.json --check'
          )
          runtime_package.write_text(json.dumps(data, indent=2) + '\n')

          entrypoint = skill / 'SKILL.md'
          lines = entrypoint.read_text().splitlines(keepends=True)
          fence_indexes = [i for i, line in enumerate(lines) if line.strip() == '---']
          body_start = fence_indexes[1] + 1 if len(fence_indexes) >= 2 else 0
          while len(''.join(lines).encode()) > 20400:
              candidates = [
                  (len(line.encode()), index)
                  for index, line in enumerate(lines)
                  if index >= body_start
                  and line.strip()
                  and not line.lstrip().startswith(('#', '-', '*', '|', '```', '>', '<'))
                  and '](' not in line
                  and '`' not in line
                  and len(line.strip()) > 80
              ]
              if not candidates:
                  break
              _, index = max(candidates)
              del lines[index]
          entrypoint.write_text(''.join(lines))
          PY
          npm run format --prefix skill/b2c-mobile-business-launch
          npm run render:design-room --prefix skill/b2c-mobile-business-launch -- --root workspace/business --out design/design-room.html --static-only
      - name: Remove migration machinery and restore normal CI
        run: |
          rm scripts/refactor-source-layout.py scripts/fix-source-layout-contracts.py scripts/repair-final-source-layout.py
          rm .github/workflows/final-source-layout.yml
          git show origin/main:.github/workflows/source-freshness.yml > .github/workflows/source-freshness.yml
      - name: Full audit
        run: npm run audit:ci
      - name: Package dry run
        run: npm pack --dry-run --json
      - name: Commit final source layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate skill source architecture"
          git push origin HEAD:${{ github.head_ref }}
