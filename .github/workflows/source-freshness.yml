name: Repository Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

# Default to read-only; the weekly refresh job re-grants write scopes it needs.
permissions:
  contents: read

# Supersede stale PR and main-branch checks, while every scheduled or manual
# refresh keeps its own run so it can finish and publish its report.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  audit:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # GitHub's standard two-vCPU runners otherwise resolve the shard pool's
    # cores-minus-two default to one worker. This runs the same isolated fixture
    # modules two at a time; B2C_FIXTURE_CONCURRENCY=1 remains the rollback switch.
    env:
      B2C_FIXTURE_CONCURRENCY: "2"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skill/formation/package-lock.json
      - run: npm ci
      - run: npm ci --prefix skill/formation
      - run: npm run audit:ci
      - run: npm pack --dry-run --json

  weekly-source-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skill/formation/package-lock.json
      - run: npm ci
      - run: npm ci --prefix skill/formation
      - name: Refresh source registry and snapshots
        id: refresh
        run: npm run refresh:source-freshness
      - name: Audit after refresh
        id: audit
        run: npm run audit:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Surface the refresh output even when the post-refresh audit fails —
        # seven scheduled runs failed with zero artifacts and nobody noticed.
        if: always()
        with:
          name: source-freshness-report
          path: |
            docs/source-freshness/SOURCE_REFRESH_REPORT.md
            docs/source-freshness/source-refresh.html
            docs/source-freshness/source-snapshots/current.json
      # Source freshness tracks this third-party action:
      # https://github.com/peter-evans/create-pull-request
      # The report remains reviewable when the audit fails, but a failed refresh
      # must never open a PR with incomplete or stale generated output.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: always() && steps.refresh.outcome == 'success'
        with:
          branch: chore/source-freshness-refresh
          title: "Refresh skill source freshness"
          commit-message: "Refresh skill source freshness"
          body: |
            Weekly source freshness refresh.

            Review auto-discovered sources as candidates before treating them as canonical launch policy. If upstream changes affect behavior, update references/templates/validators/evals in this PR before merging.
          add-paths: |
            skill/formation/validation/repository/source-registry.yaml
            docs/source-freshness/
