name: Skill Source Freshness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/repository-information-architecture
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - run: python3 scripts/finalize-repository-ia.py
      - run: python3 scripts/fix-repository-ia-rewrites.py
      - run: python3 scripts/repair-repository-ia-contracts.py
      - run: python3 scripts/fix-numeric-capability-paths.py
      - run: python3 scripts/finalize-repository-ia-contract-owners.py
      - run: python3 scripts/fix-numeric-capability-paths.py
      - run: python3 scripts/fix-landing-fixtures.py
      - name: Verify landing migration
        run: |
          echo '--- fixture paths ---'
          grep -nE 'landingInScopePass|withLandingSite|motionProseOnly|motionJsOnly|growth.*landing.*README|path\.join\(root' skill/b2c-mobile-business-launch/machine/fixtures/state-and-meta.fixtures.ts | head -n 120
          echo '--- validator paths ---'
          grep -nE 'candidateDocs|growth/landing|landingDir|tryFiles|hasLandingArtifacts' skill/b2c-mobile-business-launch/gates/growth/check-landing-funnel.ts | head -n 120
      - run: npm run format --prefix skill/b2c-mobile-business-launch
      - run: npm run render:skill-graph --prefix skill/b2c-mobile-business-launch
      - name: Promote canonical and business design tokens
        working-directory: skill/b2c-mobile-business-launch
        run: |
          npm run promote:design-tokens
          npm run promote:design-tokens -- --root business --state state/business.json --tokens state/theme.tokens.json
      - name: Render canonical and business Design Rooms
        working-directory: skill/b2c-mobile-business-launch
        run: |
          npm run render:design-room
          npm run render:design-room -- --root business --state state/business.json --tokens state/theme.tokens.json
      - name: Remove temporary machinery and restore normal CI
        run: |
          rm scripts/finalize-repository-ia.py scripts/fix-repository-ia-rewrites.py scripts/repair-repository-ia-contracts.py scripts/fix-numeric-capability-paths.py scripts/finalize-repository-ia-contract-owners.py scripts/fix-landing-fixtures.py
          rm -f scripts/inventory-repository-ia.py docs/repository-ia-inventory.md
          git show origin/main:.github/workflows/source-freshness.yml > .github/workflows/source-freshness.yml
      - run: npm run audit:ci
      - run: npm pack --dry-run --json
      - name: Commit final repository architecture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: organize business artifacts by capability"
          git push origin HEAD:agent/repository-information-architecture
