name: Skill Source Freshness

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/graph-final-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Apply graph-native catalog cutover
        run: |
          python3 scripts/cleanup-graph-catalog.py
          python3 scripts/cleanup-graph-catalog-fixes.py
          python3 - <<'PY'
          from pathlib import Path

          root = Path("skill/b2c-mobile-business-launch")
          operator = root / "graph/operators.ts"
          text = operator.read_text().replace('"accept compatibility migrations"', '"approve catalog schema changes"')
          operator.write_text(text)
          PY
      - name: Remove migration scaffolding and superseded notes
        run: |
          rm -f .github/workflows/graph-final-cleanup.yml
          rm -f scripts/cleanup-graph-catalog.py scripts/cleanup-graph-catalog-fixes.py
          rm -f docs/brainstorms/graph-execution-adoption.md
          git show origin/main:.github/workflows/source-freshness.yml > .github/workflows/source-freshness.yml
      - run: npm run format --prefix skill/b2c-mobile-business-launch
      - run: npm run render:skill-graph --prefix skill/b2c-mobile-business-launch
      - run: npm run audit:ci
      - run: npm pack --dry-run --json
      - name: Commit final refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: complete graph-native catalog cutover"
          git push origin HEAD:agent/graph-final-cleanup

  weekly-source-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Refresh source registry and snapshots
        run: npm run refresh:source-freshness
      - name: Audit after refresh
        run: npm run audit:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-freshness-report
          path: |
            docs/source-freshness/SOURCE_REFRESH_REPORT.md
            docs/source-freshness/source-refresh.html
            docs/source-freshness/source-snapshots/current.json
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: always()
        with:
          branch: chore/source-freshness-refresh
          title: "Refresh skill source freshness"
          commit-message: "Refresh skill source freshness"
          body: |
            Weekly source freshness refresh.

            Review auto-discovered sources as candidates before treating them as canonical launch policy. If upstream changes affect behavior, update references/templates/validators/evals in this PR before merging.
          add-paths: |
            skill/b2c-mobile-business-launch/machine/source-registry.yaml
            docs/source-freshness/
