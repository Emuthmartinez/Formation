name: Skill Source Freshness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/repository-information-architecture
          fetch-depth: 0
      - run: python3 scripts/inventory-repository-ia.py
      - name: Commit inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/repository-ia-inventory.md
          git commit -m "docs: inventory repository information architecture" || exit 0
          git push origin HEAD:agent/repository-information-architecture
