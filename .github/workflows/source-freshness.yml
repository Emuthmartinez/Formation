name: Skill Source Freshness

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Apply graph catalog cleanup candidate
        run: python3 scripts/cleanup-graph-catalog.py
      - run: npm run format --prefix skill/b2c-mobile-business-launch
      - run: npm run render:skill-graph --prefix skill/b2c-mobile-business-launch
      - run: npm run audit:ci
      - run: npm pack --dry-run --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: graph-final-cleanup-tree
          path: |
            skill/b2c-mobile-business-launch/graph/
            skill/b2c-mobile-business-launch/machine/fixtures/graph.fixtures.ts

  weekly-source-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - name: Refresh source registry and snapshots
        run: npm run refresh:source-freshness
      - name: Audit after refresh
        run: npm run audit:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-freshness-report
          path: |
            docs/source-freshness/SOURCE_REFRESH_REPORT.md
            docs/source-freshness/source-refresh.html
            docs/source-freshness/source-snapshots/current.json
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: always()
        with:
          branch: chore/source-freshness-refresh
          title: "Refresh skill source freshness"
          commit-message: "Refresh skill source freshness"
          body: |
            Weekly source freshness refresh.

            Review auto-discovered sources as candidates before treating them as canonical launch policy. If upstream changes affect behavior, update references/templates/validators/evals in this PR before merging.
          add-paths: |
            skill/b2c-mobile-business-launch/machine/source-registry.yaml
            docs/source-freshness/
