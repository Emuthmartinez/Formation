name: Skill Source Freshness

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/graph-native-doc-refresh
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix skill/b2c-mobile-business-launch
      - run: python3 scripts/finalize-doc-refresh.py
      - run: npm run format --prefix skill/b2c-mobile-business-launch
      - run: npm run render:skill-graph --prefix skill/b2c-mobile-business-launch
      - name: Remove temporary finalizer and restore CI
        run: |
          rm scripts/finalize-doc-refresh.py
          git show origin/main:.github/workflows/source-freshness.yml > .github/workflows/source-freshness.yml
      - run: npm run audit:ci
      - run: npm pack --dry-run --json
      - name: Commit documentation refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: align all skill documentation with graph execution"
          git push origin HEAD:docs/graph-native-doc-refresh

  weekly-source-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped
