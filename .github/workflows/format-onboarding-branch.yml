name: Format onboarding graph branch

on:
  push:
    branches:
      - agent/onboarding-system-graph

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/onboarding-system-graph
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files and remove this temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/format-onboarding-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format onboarding graph integration"
          git push origin HEAD:agent/onboarding-system-graph
