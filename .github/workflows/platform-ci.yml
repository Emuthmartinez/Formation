name: platform:ci

on:
  pull_request:
    paths:
      - "platform/**"
      - "docs/platform/**"
      - "docs/architecture.md"
      - "README.md"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "docs/platform/**"
      - "docs/architecture.md"
      - "README.md"
      - ".github/workflows/platform-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check platform
        run: node platform/run.mjs check
      - name: Test platform
        run: node platform/run.mjs test
      - name: Build platform
        run: node platform/run.mjs build
