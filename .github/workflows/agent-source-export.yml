name: Publish business unit refactor

on:
  push:
    branches:
      - agent/business-unit-capabilities
    paths:
      - ".github/workflows/agent-source-export.yml"

permissions:
  contents: write

concurrency:
  group: publish-business-unit-refactor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/business-unit-refactor -name 'part-*.b64' | wc -l)" -eq 20
          cat .github/business-unit-refactor/part-{00..19}.b64 > /tmp/business-unit-refactor.b64
          base64 --decode /tmp/business-unit-refactor.b64 > /tmp/business-unit-refactor.patch.xz
          echo "5bcd8d08d107215183992cecbb8d91b19ea84bb268cd8d03b2ce190b04883b68  /tmp/business-unit-refactor.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/business-unit-refactor.patch.xz > /tmp/business-unit-refactor.patch
          echo "595d1f5108b4f1e9b0b04e5f6ae151d5a15ec4babd625e07c70d51381a42af17  /tmp/business-unit-refactor.patch" | sha256sum --check --strict

      - name: Apply the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/agent-source-export.yml <<'ORIGINAL_WORKFLOW'
          name: Agent source export

          on:
            pull_request:
              branches: [main]
              paths:
                - ".github/workflows/agent-source-export.yml"

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Export checked-out source
                  run: |
                    tar --exclude=.git -czf /tmp/b2c-mobile-business-launch-skill.tar.gz .
                - uses: actions/upload-artifact@v7
                  with:
                    name: agent-source-export
                    path: /tmp/b2c-mobile-business-launch-skill.tar.gz
                    retention-days: 1
          ORIGINAL_WORKFLOW
          git add .github/workflows/agent-source-export.yml
          git apply --index --binary /tmp/business-unit-refactor.patch
          rm -rf .github/business-unit-refactor
          git add -A
          test ! -e .github/workflows/agent-source-export.yml
          test ! -d .github/business-unit-refactor

      - name: Install dependencies
        run: npm ci

      - name: Format and render projections
        run: |
          npm run format
          npm run render:skill-graph
          git add -A

      - name: Run authoritative audit
        run: npm run audit:ci

      - name: Run validator fixtures
        run: npm run test:validators

      - name: Run LaunchBench
        run: npm run launchbench

      - name: Commit and publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(skill): organize knowledge by business unit and capability (v0.66.0)"
          git push origin HEAD:agent/business-unit-capabilities
