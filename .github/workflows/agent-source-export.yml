name: Publish typed skill graph

on:
  push:
    branches:
      - agent/typed-skill-graph
    paths:
      - ".github/workflows/agent-source-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          set -euo pipefail

          part_count="$(find .github/typed-skill-graph-patch -type f -name 'part-*.b64' | wc -l | tr -d ' ')"
          test "$part_count" = "16"

          cat .github/typed-skill-graph-patch/part-*.b64 \
            | base64 --decode \
            > /tmp/typed-skill-graph.patch.xz

          echo "a8b2e03b7d609c0b9121b40107322c929b0a8ba89b5c1933020d5ee456e5b136  /tmp/typed-skill-graph.patch.xz" \
            | sha256sum --check --strict

          xz --decompress --stdout /tmp/typed-skill-graph.patch.xz \
            > /tmp/typed-skill-graph.patch

          echo "a35714a8fd704c3b2f071f0206d31c59e9af1505e2b1206bea59ccdb2fc55569  /tmp/typed-skill-graph.patch" \
            | sha256sum --check --strict

          git apply --check /tmp/typed-skill-graph.patch
          git apply --index /tmp/typed-skill-graph.patch

          rm -rf .github/typed-skill-graph-patch
          rm .github/workflows/agent-source-export.yml

      - name: Install dependencies
        run: npm ci

      - name: Format and regenerate graph projections
        run: |
          npm run format
          npm run render:skill-graph

      - name: Validate implementation
        run: |
          npm run audit:ci
          npm run test:validators
          npm run launchbench

      - name: Publish implementation commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "refactor: add typed skill graph architecture"
          git push origin HEAD:agent/typed-skill-graph
