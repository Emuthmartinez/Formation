name: Format Graph Execution

on:
  pull_request:
    paths:
      - skill/b2c-mobile-business-launch/graph/execution.ts
      - .github/workflows/format-graph-execution.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write skill/b2c-mobile-business-launch/graph/execution.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-graph-execution
          path: skill/b2c-mobile-business-launch/graph/execution.ts
