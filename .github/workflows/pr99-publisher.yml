name: PR99 Publisher

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.pull_request.number == 99 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/business-unit-capabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted transport branch
        uses: actions/checkout@v4
        with:
          repository: Emuthmartinez/b2c-mobile-business-launch-skill
          ref: agent/business-unit-capabilities
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/business-unit-refactor
          cat .github/business-unit-refactor/part-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/business-unit-refactor.patch.xz
          echo '5bcd8d08d107215183992cecbb8d91b19ea84bb268cd8d03b2ce190b04883b68  /tmp/business-unit-refactor.patch.xz' | sha256sum -c -
          xz -dc /tmp/business-unit-refactor.patch.xz > /tmp/business-unit-refactor.patch
          echo '595d1f5108b4f1e9b0b04e5f6ae151d5a15ec4babd625e07c70d51381a42af17  /tmp/business-unit-refactor.patch' | sha256sum -c -

      - name: Build final implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cat > .github/workflows/agent-source-export.yml <<'YAML'
          name: Agent source export

          on:
            pull_request:
              branches: [main]
              paths:
                - ".github/workflows/agent-source-export.yml"

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Export checked-out source
                  run: |
                    tar --exclude=.git -czf /tmp/b2c-mobile-business-launch-skill.tar.gz .
                - uses: actions/upload-artifact@v7
                  with:
                    name: agent-source-export
                    path: /tmp/b2c-mobile-business-launch-skill.tar.gz
                    retention-days: 1
          YAML
          git apply --index --whitespace=nowarn /tmp/business-unit-refactor.patch
          rm -rf .github/business-unit-refactor
          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Format and regenerate
        run: |
          npm run format
          npm run render:skill-graph
          git add -A

      - name: Run authoritative suite
        run: |
          npm run audit:ci
          npm run test:validators
          npm run launchbench

      - name: Commit and push final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(skill): organize business units and capabilities (v0.66.0)'
          git push --force-with-lease origin HEAD:agent/business-unit-capabilities
