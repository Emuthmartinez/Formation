name: PR99 Publisher

on:
  pull_request_target:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/business-unit-capabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect transport
        id: transport
        shell: bash
        run: |
          if [ -d .github/business-unit-refactor ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify patch
        if: steps.transport.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/business-unit-refactor/part-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/business-unit-refactor.patch.xz
          echo '5bcd8d08d107215183992cecbb8d91b19ea84bb268cd8d03b2ce190b04883b68  /tmp/business-unit-refactor.patch.xz' | sha256sum -c -
          xz -dc /tmp/business-unit-refactor.patch.xz > /tmp/business-unit-refactor.patch
          echo '595d1f5108b4f1e9b0b04e5f6ae151d5a15ec4babd625e07c70d51381a42af17  /tmp/business-unit-refactor.patch' | sha256sum -c -

      - name: Apply implementation
        if: steps.transport.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/agent-source-export.yml > .github/workflows/agent-source-export.yml
          git apply --index --whitespace=nowarn /tmp/business-unit-refactor.patch
          rm -rf .github/business-unit-refactor
          git add -A

      - name: Install dependencies
        if: steps.transport.outputs.present == 'true'
        run: npm ci

      - name: Format and regenerate
        if: steps.transport.outputs.present == 'true'
        run: |
          npm run format
          npm run render:skill-graph
          git add -A

      - name: Run authoritative suite
        if: steps.transport.outputs.present == 'true'
        run: |
          npm run audit:ci
          npm run test:validators
          npm run launchbench

      - name: Commit and push implementation
        if: steps.transport.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(skill): organize business units and capabilities (v0.66.0)'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
