version: 2

updates:
  # Root toolchain: tsx, typescript, prettier, ajv, vite, the Anthropic SDK.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # The shipped runtime copy. check:package-parity requires both to move together,
  # so these PRs usually need the root one merged alongside.
  - package-ecosystem: npm
    directory: /skill/formation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
